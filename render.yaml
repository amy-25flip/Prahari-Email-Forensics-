services:
  - type: web
    name: email-forensics
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: RETENTION_HOURS
        value: "24"
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: RECEIVER_KEYS_JSON
        sync: false
      - key: RECEIVER_SIGNING_KEY
        sync: false
      - key: PHISHTANK_APP_KEY
        sync: false
      - key: SIEM_MODE
        value: disabled
      - key: SPLUNK_HEC_URL
        sync: false
      - key: SPLUNK_HEC_TOKEN
        sync: false
      - key: WAZUH_LOG_PATH
        sync: false
      - key: DB_ENCRYPTION_KEY
        sync: false
      - key: PROTECTED_IDENTITIES_JSON
        sync: false
      - key: GMAIL_PUSH_AUDIENCE
        sync: false
      - key: GMAIL_PUSH_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GMAIL_TOKEN_FILE
        value: /etc/secrets/gmail_token.json
      - key: GMAIL_STATE_FILE
        value: /data/gmail_watch_state.json
      - key: GMAIL_CASES_READ_TOKEN
        sync: false

services:
  - type: web
    name: email-forensics
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # DEMO/EVALUATION ONLY. `free` is a placeholder that will NOT reliably run
    # this image as-is: BERT + torch CPU inference needs more than the free
    # tier's 512 MB RAM (expect OOM / failed readiness, silently degrading to
    # local_model.py's "Unavailable" path), and the free tier has no persistent
    # disk, so the /data case database and Gmail watch state are lost on every
    # redeploy/idle-recycle. For a real deployment, change `plan` to a paid
    # instance (e.g. `standard`) AND attach a persistent disk mounted at /data.
    plan: free
    # /api/health always returns status:ready regardless of whether the BERT
    # model has finished loading (local_model.status starts at 'loading' and
    # is checked nowhere in that handler) -- pointing Render's rolling-deploy
    # traffic cutover at it meant a fresh instance could receive real
    # /api/analyze traffic before the model was ready, silently falling back
    # to local_model.py's "Unavailable" degraded classification. /api/ready
    # is the endpoint that actually reflects model readiness (503 until
    # ready), matching the Dockerfile's own equivalent fix.
    healthCheckPath: /api/ready
    envVars:
      - key: COOKIE_SECURE
        value: "1"
      - key: RETENTION_HOURS
        value: "24"
      - key: ABUSEIPDB_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: RECEIVER_KEYS_JSON
        sync: false
      - key: RECEIVER_SIGNING_KEY
        sync: false
      - key: PHISHTANK_APP_KEY
        sync: false
      - key: SIEM_MODE
        value: disabled
      - key: SPLUNK_HEC_URL
        sync: false
      - key: SPLUNK_HEC_TOKEN
        sync: false
      - key: WAZUH_LOG_PATH
        sync: false
      - key: DB_ENCRYPTION_KEY
        sync: false
      - key: PROTECTED_IDENTITIES_JSON
        sync: false
      - key: GMAIL_PUSH_AUDIENCE
        sync: false
      - key: GMAIL_PUSH_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GMAIL_TOKEN_FILE
        value: /etc/secrets/gmail_token.json
      - key: GMAIL_STATE_FILE
        value: /data/gmail_watch_state.json
      - key: GMAIL_CASES_READ_TOKEN
        sync: false
      - key: GMAIL_PUBSUB_TOPIC
        sync: false
      - key: GMAIL_WATCH_ADMIN_TOKEN
        sync: false
